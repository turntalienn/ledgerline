spring:
  application:
    name: ledgerline
  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerline
    username: ledgerline
    password: ledgerline
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_updates: true   # flush UPDATEs in primary-key order: same lock order as the row-lock strategy
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: false   # Enable explicitly when comparing virtual and platform threads
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: localhost:19092   # Redpanda from compose.yaml
    producer:
      acks: all
      properties:
        enable.idempotence: true   # no duplicates from the producer's own retries
        linger.ms: 5
        max.block.ms: 5000          # fail fast when the broker is down; the relay retries next poll
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      auto-offset-reset: earliest
    admin:
      operation-timeout: 5s
      close-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

ledgerline:
  balance:
    strategy: row-lock   # row-lock | optimistic | sharded  (restart to switch)
    shards: 8
    retry:
      max-attempts: 20
      base-backoff: 2ms
      max-backoff: 100ms

  fees:
    enabled: false       # turn on for the fee-pricing experiment (k6/fee-experiment.js)
    arms:
      - name: flat-5
        flat: 500                    # Rs 5 on every transfer
      - name: pct-50bps
        bps: 50                      # 0.5%
      - name: flat-2-plus-20bps-cap-25
        flat: 200
        bps: 20
        cap: 2500

  outbox:
    topic: ledger.events
    partitions: 3
    batch-size: 100
    relay:
      enabled: true
      poll-interval-ms: 500
    consumers:
      enabled: true

